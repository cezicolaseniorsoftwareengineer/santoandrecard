quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:cards;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
quarkus.datasource.username=sa
quarkus.datasource.password=sa
quarkus.flyway.migrate-at-start=false
quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.log.level=WARN

# The circuit breaker is application-scoped, so a test that deliberately opens it
# leaves it open for whatever runs next. Production keeps the five second delay;
# here it recovers quickly so one test does not decide another one's outcome.
com.cezicola.card.adapter.out.merchant.ResilientMerchantAuthorizationGateway/authorize/CircuitBreaker/delay=150
com.cezicola.card.adapter.out.merchant.ResilientMerchantAuthorizationGateway/authorize/CircuitBreaker/delayUnit=MILLIS

# Coverage. Generated classes and the Quarkus runtime wiring are excluded: they
# are not this project's code, and counting them turns the figure into noise.
# A profile that changes build-time configuration restarts the application, so
# the execution data has to accumulate across restarts rather than be replaced
# by whichever test class ran last.
quarkus.jacoco.report=true
quarkus.jacoco.reuse-data-file=true
