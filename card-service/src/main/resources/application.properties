quarkus.application.name=card-service
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:card_app}
quarkus.datasource.password=${DB_PASSWORD}
# Dev profile only: matches the throwaway credential already declared in
# compose.yaml so `quarkus:dev` needs no environment setup. Other profiles keep
# requiring DB_PASSWORD and fail to start without it.
%dev.quarkus.datasource.password=${DB_PASSWORD:card_app_local}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/card_platform}
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.flyway.migrate-at-start=true
quarkus.smallrye-openapi.info-title=Cezi Cola Card Platform API
quarkus.smallrye-openapi.info-version=0.1.0
quarkus.micrometer.export.prometheus.enabled=true
card.purchase.max-concurrent=${CARD_PURCHASE_MAX_CONCURRENT:32}

# Bearer-token authentication. Tenant and customer identity are taken from the
# verified token claims; no request header may select them.
quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL:http://localhost:8180/realms/card-platform}
quarkus.oidc.client-id=${OIDC_CLIENT_ID:card-service}
quarkus.oidc.application-type=service
quarkus.oidc.roles.source=accesstoken

# Deny by default: every /api path requires an authenticated caller, and only the
# operational endpoints stay public.
quarkus.http.auth.permission.api.paths=/api/*
quarkus.http.auth.permission.api.policy=authenticated
quarkus.http.auth.permission.operational.paths=/q/health,/q/health/*,/q/metrics,/q/openapi
quarkus.http.auth.permission.operational.policy=permit

# The test profile injects identities through @TestSecurity, so no Keycloak
# instance is contacted and no discovery request is made during the build.
%test.quarkus.oidc.tenant-enabled=false
