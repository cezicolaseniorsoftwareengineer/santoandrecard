quarkus.application.name=card-service
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:card_app}
quarkus.datasource.password=${DB_PASSWORD}
# Dev profile only: matches the throwaway credential already declared in
# compose.yaml so `quarkus:dev` needs no environment setup. Other profiles keep
# requiring DB_PASSWORD and fail to start without it.
%dev.quarkus.datasource.password=${DB_PASSWORD:card_app_local}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/card_platform}

# Connection sizing is stated rather than inherited, because the default suits a
# database on the same machine and a managed one is neither free nor unlimited:
# hosted PostgreSQL caps connections per project, and two replicas at the default
# pool size can exhaust a small plan on their own.
quarkus.datasource.jdbc.min-size=${DB_POOL_MIN:2}
quarkus.datasource.jdbc.max-size=${DB_POOL_MAX:10}
# A remote database can be slow to answer; it should not be able to hang a
# request thread indefinitely waiting for a connection.
quarkus.datasource.jdbc.acquisition-timeout=${DB_ACQUISITION_TIMEOUT:5S}
# Serverless providers drop idle connections on their side. Validating on
# borrow costs a round trip and saves the first query after an idle period from
# failing on a connection the pool still believes is open.
quarkus.datasource.jdbc.background-validation-interval=${DB_VALIDATION_INTERVAL:30S}
quarkus.datasource.jdbc.new-connection-sql=SELECT 1
# A connection held far longer than any request takes is a leak, not slowness.
quarkus.datasource.jdbc.leak-detection-interval=${DB_LEAK_DETECTION:60S}
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.flyway.migrate-at-start=true
quarkus.smallrye-openapi.info-title=Cezi Cola Card Platform API
quarkus.smallrye-openapi.info-version=0.1.0
quarkus.micrometer.export.prometheus.enabled=true
card.purchase.max-concurrent=${CARD_PURCHASE_MAX_CONCURRENT:32}

# Issuing limit for a card the cardholder requests themselves. It is issuer
# policy, never a value taken from the request: a limit chosen by the applicant
# is not a limit.
card.self-service.credit-limit=${CARD_SELF_SERVICE_CREDIT_LIMIT:5000.00}

# Event publication. The outbox is drained on a schedule rather than in the
# request path: a broker that is slow or down must not fail a payment that has
# already been committed to the ledger.
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
card.events.topic=${CARD_EVENTS_TOPIC:card-platform.events}
card.events.send-timeout-ms=${CARD_EVENTS_SEND_TIMEOUT_MS:10000}
card.outbox.poll-interval=${CARD_OUTBOX_POLL_INTERVAL:2s}
card.outbox.batch-size=${CARD_OUTBOX_BATCH_SIZE:100}
# After this many failures the event stays unpublished and visible rather than
# being discarded. An event about money is an operator's problem, not garbage.
card.outbox.max-attempts=${CARD_OUTBOX_MAX_ATTEMPTS:10}

# The fast test profile has no broker. The relay is exercised against a stub
# publisher instead, so the guarantees are tested without one.
%test.card.outbox.poll-interval=24h

# How long a hold stands before the issuer releases it. Seven days is the usual
# window for a card authorization; the sweep runs far more often than that so an
# expired hold does not sit on a customer's funds waiting for a tick.
card.authorization.hold-duration=${CARD_AUTHORIZATION_HOLD_DURATION:P7D}
card.authorization.expiry-interval=${CARD_AUTHORIZATION_EXPIRY_INTERVAL:60s}
card.authorization.expiry-batch-size=${CARD_AUTHORIZATION_EXPIRY_BATCH_SIZE:200}

# The sweep is disabled in the fast test profile; the tests drive it directly so
# they assert what it does rather than when it happens.
%test.card.authorization.expiry-interval=24h

# Idempotency keys are kept far longer than any client would retry, because
# forgetting one while a caller still holds it turns their retry into a second
# payment. Thirty days is well past that, and the sweep is bounded so a payment
# never waits behind housekeeping.
card.idempotency.retention=${CARD_IDEMPOTENCY_RETENTION:P30D}
card.idempotency.prune-interval=${CARD_IDEMPOTENCY_PRUNE_INTERVAL:1h}
card.idempotency.prune-batch-size=${CARD_IDEMPOTENCY_PRUNE_BATCH_SIZE:500}

# Driven directly by the tests, so they assert what the sweep does rather than
# when it happens.
%test.card.idempotency.prune-interval=24h

# Redis. Nothing here is a source of truth: it holds a short-window throttle and
# a copy of a figure the ledger can always recompute. Losing the whole dataset
# costs a window of throttling and one database read, never a cent.
quarkus.redis.hosts=${REDIS_URL:redis://localhost:6379}
quarkus.redis.timeout=2s
# Redis is deliberately excluded from readiness. The throttle and the cache both
# degrade open, so an unreachable Redis is a slower service, not an unhealthy
# one — and letting it fail the probe would have Kubernetes pull a pod that can
# still take payments out of service.
quarkus.redis.health.enabled=false
# Build-time: decides whether the Redis adapters exist at all, or whether the
# default beans answer with the degraded behaviour instead.
card.redis.enabled=true
card.cache.summary-ttl-seconds=${CARD_CACHE_SUMMARY_TTL_SECONDS:10}

# The fast test profile runs without Redis. Both features degrade to their
# absent behaviour, which is exactly how they behave when Redis is unreachable.
%test.card.redis.enabled=false

# Bearer-token authentication. Tenant and customer identity are taken from the
# verified token claims; no request header may select them.
quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL:http://localhost:8180/realms/card-platform}
quarkus.oidc.client-id=${OIDC_CLIENT_ID:card-service}
quarkus.oidc.application-type=service
quarkus.oidc.roles.source=accesstoken
# The browser obtains its token through the provider's public address while this
# service discovers the provider over the internal one. The `iss` claim then
# carries the public address, and validation has to expect it rather than the URL
# it discovered. The default keeps both the same, which is the local case.
quarkus.oidc.token.issuer=${OIDC_TOKEN_ISSUER:${OIDC_AUTH_SERVER_URL:http://localhost:8180/realms/card-platform}}

# Deny by default: every /api path requires an authenticated caller, and only the
# operational endpoints stay public.
quarkus.http.auth.permission.api.paths=/api/*
quarkus.http.auth.permission.api.policy=authenticated
# OPTIONS is excluded on purpose. A CORS preflight carries no credentials by
# specification, so requiring authentication on it would reject every browser
# request before the real call is ever made. The preflight exposes no data and
# the CORS origin allow-list still governs which sites may proceed.
quarkus.http.auth.permission.api.methods=GET,POST,PUT,DELETE,PATCH
quarkus.http.auth.permission.operational.paths=/q/health,/q/health/*,/q/metrics,/q/openapi
quarkus.http.auth.permission.operational.policy=permit

# Browser access is restricted to the configured origins. This is an allow-list,
# never a wildcard: with credentials in play a wildcard origin would let any site
# call the API with the user's token.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${WEB_APP_ORIGINS:http://localhost:4200}
quarkus.http.cors.methods=GET,POST,PUT,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type,Idempotency-Key
quarkus.http.cors.access-control-max-age=24H

# The test profile injects identities through @TestSecurity, so no Keycloak
# instance is contacted and no discovery request is made during the build.
%test.quarkus.oidc.tenant-enabled=false
