quarkus.application.name=card-service
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:card_app}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/card_platform}
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.flyway.migrate-at-start=true
quarkus.smallrye-openapi.info-title=Cezi Cola Card Platform API
quarkus.smallrye-openapi.info-version=0.1.0
quarkus.micrometer.export.prometheus.enabled=true
