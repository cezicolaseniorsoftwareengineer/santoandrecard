# Pinned so the project identity does not come from the directory name. Without
# it, renaming the folder makes Compose treat everything as a new project and the
# existing containers and the postgres volume are left orphaned.
name: santo-andre-card

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: card_platform
      POSTGRES_USER: card_app
      POSTGRES_PASSWORD: card_app_local
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U card_app -d card_platform"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs on first initialisation only, which is when the Keycloak database
      # has to exist before Keycloak first connects.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:4.1.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      # The outbox protects the source of an event, not its delivery: once a row
      # is marked published it is never sent again. Losing the log therefore
      # loses every event no consumer had read yet.
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Local identity provider. The credentials below are development fixtures and
  # must never be reused anywhere else.
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin_local
      KC_HTTP_PORT: "8180"
      KC_HEALTH_ENABLED: "true"
      # Accounts live in a database rather than inside the container. With the
      # development default they survived a restart but not a recreation, and
      # the realm was reimported over them — every self-registered customer
      # silently gone. Override KC_DB_URL to point this at a managed instance.
      KC_DB: postgres
      KC_DB_URL: ${KC_DB_URL:-jdbc:postgresql://postgres:5432/keycloak}
      KC_DB_USERNAME: ${KC_DB_USERNAME:-card_app}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-card_app_local}
      # A first start creates the schema and imports the realm while Infinispan
      # and Hibernate are still warming up. On a machine sharing the Docker VM
      # with anything else, every one of those steps stretches, and the default
      # five-second acquisition timeout expired mid-import: the server exited,
      # the schema stayed half-created and port 8180 refused connections, which
      # reaches the browser as a broken login route rather than as a database
      # problem. The pool is allowed to wait long enough for a slow first boot.
      QUARKUS_DATASOURCE_JDBC_ACQUISITION_TIMEOUT: "120"
      KC_DB_POOL_INITIAL_SIZE: "1"
      KC_DB_POOL_MIN_SIZE: "1"
      KC_DB_POOL_MAX_SIZE: "10"
      # Bounded so the identity provider cannot take the whole VM with it: the
      # container default sizes the heap from memory it does not own alone.
      JAVA_OPTS_KC_HEAP: "-Xms256m -Xmx768m"
    ports:
      - "8180:8180"
    volumes:
      - ./keycloak/realm-card-platform.json:/opt/keycloak/data/import/realm-card-platform.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q UP"]
      interval: 10s
      timeout: 5s
      # The first boot creates the schema and imports the realm. Counting that
      # against the retry budget declared the service unhealthy while it was
      # still legitimately starting.
      start_period: 180s
      retries: 30

  # Observability. Kept behind a profile so the everyday bring-up stays small:
  #   docker compose --profile observability up -d
  # Prometheus holds the numbers, Tempo holds the traces, Grafana shows both and
  # arrives with the dashboard already provisioned — a dashboard nobody has to
  # rebuild by hand is the only kind that survives.
  prometheus:
    image: prom/prometheus:v3.6.0
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=24h
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      # The service runs on the host during development, so the scrape target
      # has to resolve back out of the container.
      - "host.docker.internal:host-gateway"

  tempo:
    image: grafana/tempo:2.9.0
    profiles: ["observability"]
    command: ["-config.file=/etc/tempo.yaml"]
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo

  grafana:
    image: grafana/grafana:12.2.0
    profiles: ["observability"]
    depends_on:
      - prometheus
      - tempo
    environment:
      # Anonymous viewing on a local stack only. This exposes dashboards, never
      # the application or its data, and must not be carried anywhere else.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-grafana_local}
      GF_USERS_DEFAULT_THEME: dark
    ports:
      - "3000:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  postgres-data:
  kafka-data:
  prometheus-data:
  tempo-data:
