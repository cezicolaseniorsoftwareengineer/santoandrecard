# Server block for the built Angular bundle. The unprivileged nginx image listens
# on 8080 as UID 101, so no capability is needed to bind the port.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page application: every unknown path is a client-side route and must
    # return the shell, not a 404. Without this a page reload on /extrato breaks.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The endpoints are environment-specific and mounted from a ConfigMap. Caching
    # it would let a pod keep serving the previous environment's issuer after a
    # redeploy.
    location = /config.json {
        add_header Cache-Control "no-store" always;
    }

    # Hashed filenames are content-addressed, so they can be cached indefinitely.
    location ~* \.(js|css|woff2?|png|svg|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html carries the references to the hashed assets. A cached copy would
    # point at files that a new deployment has already removed.
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
