# Single-node Keycloak in development mode for local/dev clusters only. It runs
# with an in-memory database, so the realm is re-imported on every restart and no
# identity data survives. Production must use a managed, backed-up Keycloak (or
# another OIDC provider) started with `start`, not `start-dev`, behind TLS.
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  labels:
    app.kubernetes.io/name: keycloak
spec:
  selector:
    app.kubernetes.io/name: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels:
    app.kubernetes.io/name: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.4
          args: ["start-dev", "--import-realm", "--http-port=8080"]
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: admin
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: card-service-secrets
                  key: keycloak-admin-password
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_HTTP_ENABLED
              value: "true"
            # The browser reaches Keycloak through the Ingress, so every URL it
            # issues — authorization redirects and the `iss` claim — must carry
            # the public host. Left unset it would advertise the pod address,
            # which no browser can reach.
            - name: KC_HOSTNAME
              value: http://keycloak.card-platform.localhost
            # The Service is still addressed as http://keycloak:8080 from inside
            # the cluster; without this the strict hostname check rejects those
            # requests, including card-service's discovery call.
            - name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
              value: "true"
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          # Keycloak rebuilds its configuration and imports the realm before it
          # serves anything, and on a contended node that takes minutes. Without
          # a startup probe the liveness probe owns that window: it began at 60s
          # and killed the container three failures later, at exactly 105s,
          # every time — a crash loop with 139 restarts in which the process was
          # never unhealthy, only unfinished.
          #
          # A startup probe holds liveness back until the container has answered
          # once. Ten minutes of budget is generous by design: the cost of being
          # generous is a slow first start, and the cost of being tight is a
          # service that never starts at all.
          startupProbe:
            httpGet:
              path: /health/started
              port: management
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
            periodSeconds: 10
            # The 1s default is shorter than this endpoint answers in while the
            # realm is still loading, and a probe that times out reads as a
            # failure rather than as slowness.
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health/live
              port: management
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
      volumes:
        - name: realm
          configMap:
            name: keycloak-realm
