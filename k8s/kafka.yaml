# Single-node KRaft broker, mirroring compose.yaml. Like Redis it is provisioned
# for the next increments and is not yet an application dependency.
#
# Single node means replication factor 1 on every internal topic: this is a
# development broker with no durability guarantee against node loss.
apiVersion: v1
kind: Service
metadata:
  name: kafka
spec:
  clusterIP: None
  # A KRaft broker resolves its own pod name to reach the controller quorum, and
  # a headless Service publishes a pod's DNS record only once that pod is Ready.
  # The broker is therefore waiting on a name that will not exist until it has
  # finished starting, which it cannot do without the name: kafka-0 failed with
  # UnknownHostException on every attempt and never once became Ready.
  #
  # Publishing addresses before readiness breaks the deadlock. It is the right
  # trade for a StatefulSet whose members must find each other: the record is
  # for peer discovery, and clients reach the broker through readiness anyway.
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: kafka
  ports:
    - name: plaintext
      port: 9092
      targetPort: plaintext
    - name: controller
      port: 9093
      targetPort: controller
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  labels:
    app.kubernetes.io/name: kafka
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kafka
          image: apache/kafka:4.1.1
          ports:
            - name: plaintext
              containerPort: 9092
            - name: controller
              containerPort: 9093
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://:9092,CONTROLLER://:9093
            # Advertised as the stable per-pod DNS name of the headless Service.
            # Advertising localhost, as compose.yaml does, only works because the
            # client there shares the host's network namespace.
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://kafka-0.kafka:9092
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@kafka-0.kafka:9093
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/data
          # The readiness command launches a whole JVM. Running it every ten
          # seconds against a broker limited to one CPU means the probe competes
          # with the thing it is measuring, and it lost: the broker never bound
          # its listener inside the liveness budget and was killed 343 times.
          #
          # Startup is now judged by the listener being open, which costs
          # nothing. The client check still runs, because a bound socket is not
          # the same as a broker that can serve metadata — but once, at a period
          # long enough that it is an observation rather than a load.
          startupProbe:
            tcpSocket:
              port: plaintext
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list
            periodSeconds: 60
            timeoutSeconds: 20
            failureThreshold: 5
          livenessProbe:
            tcpSocket:
              port: plaintext
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1536Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
