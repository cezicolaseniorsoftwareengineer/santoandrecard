# Single-node PostgreSQL for local/dev clusters only.
# Production must point DB_URL at a managed, backed-up instance instead.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: card_platform
            - name: POSTGRES_USER
              value: card_app
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: card-service-secrets
                  key: db-password
            # PGDATA must be a subdirectory of the mount: the volume root may
            # carry a lost+found entry that initdb refuses to initialise into.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          # An exec probe pays for a container exec on every attempt, which on a
          # busy node exceeds the 1s default timeout while the database is
          # perfectly healthy. That restarted a working PostgreSQL under load,
          # so the timeout is explicit and liveness tolerates a burst of slow
          # probes before it declares the process dead.
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "card_app", "-d", "card_platform"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "card_app", "-d", "card_platform"]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /var/run/postgresql
      volumes:
        - name: tmp
          emptyDir: {}
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
