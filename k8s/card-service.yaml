apiVersion: v1
kind: ConfigMap
metadata:
  name: card-service-config
data:
  DB_URL: jdbc:postgresql://postgres:5432/card_platform
  DB_USERNAME: card_app
  OIDC_AUTH_SERVER_URL: http://keycloak:8080/realms/card-platform
  OIDC_CLIENT_ID: card-service
  # The browser origin the interface is served from, which is an Ingress host and
  # not the cluster-local Service name. The CORS allow-list is matched against
  # what the tab sends, so a cluster name here would reject every request.
  WEB_APP_ORIGINS: http://app.card-platform.localhost
  # Discovery runs over the Service name above; the token the browser presents was
  # issued through the Ingress host, so `iss` carries that one instead.
  OIDC_TOKEN_ISSUER: http://keycloak.card-platform.localhost/realms/card-platform
  # Kafka and Redis were deployed to this namespace and the service was never
  # told where they are, so both fell back to their localhost defaults inside
  # the pod. The failure is quiet by design and therefore easy to miss: the
  # outbox holds an event it cannot publish rather than losing it, and the
  # throttle and cache degrade open. The events still never left, and the
  # brokers ran for two days serving nobody.
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  REDIS_URL: redis://redis:6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: card-service
  labels:
    app.kubernetes.io/name: card-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: card-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: card-service
    spec:
      automountServiceAccountToken: false
      securityContext:
        # The image runs as UID 185 (jboss). Declaring it here keeps the pod
        # admissible under the restricted Pod Security Standard even if the
        # image is rebuilt without a USER directive.
        runAsNonRoot: true
        runAsUser: 185
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: card-service
      containers:
        - name: card-service
          # Tags must be immutable: reusing a tag leaves nodes serving a stale
          # cached image under imagePullPolicy IfNotPresent.
          image: card-service
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: card-service-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: card-service-secrets
                  key: db-password
            # Tracing is off until a collector is named. A service that cannot
            # reach its exporter must not spend request time discovering that,
            # and a cluster without one should not pay for the attempt.
            - name: OTEL_ENABLED
              value: "false"
            - name: OTEL_ENDPOINT
              value: http://tempo.observability.svc.cluster.local:4317
            - name: OTEL_ENVIRONMENT
              value: kubernetes
            # Every request traced is right for a demonstration and wrong for a
            # deployment that takes load. Stated here so lowering it is a value
            # change rather than a rebuild.
            - name: OTEL_SAMPLER
              value: parentbased_traceidratio
            - name: OTEL_SAMPLER_RATIO
              value: "0.1"
          # The 1s default probe timeout is shorter than a JVM start on a
          # contended node, and the startup budget has to cover Flyway running
          # the migrations. Both were too tight to boot here, so the timeout and
          # the startup budget are explicit rather than inherited.
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          startupProbe:
            httpGet:
              path: /q/health/started
              port: http
            failureThreshold: 90
            periodSeconds: 2
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            # readOnlyRootFilesystem leaves the JVM without a writable
            # java.io.tmpdir; Quarkus and Flyway both need one to start.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: card-service
spec:
  selector:
    app.kubernetes.io/name: card-service
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: card-service
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: card-service
