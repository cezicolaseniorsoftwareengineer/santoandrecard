name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # CodeQL uploads its findings to the repository's security tab.
  security-events: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: card-service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test
        run: mvn -B --no-transfer-progress clean verify

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: card-service/target/surefire-reports/
          if-no-files-found: ignore

  # The automated suite runs on H2 in PostgreSQL compatibility mode for speed, and
  # H2 has already accepted schemas that real PostgreSQL rejects. This job boots
  # the packaged application against PostgreSQL so Flyway runs the real migrations
  # and Hibernate validates the mapping against the real types.
  postgres-schema:
    name: schema on PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: card_platform
          POSTGRES_USER: card_app
          POSTGRES_PASSWORD: card_app_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U card_app -d card_platform"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Package
        run: mvn -B --no-transfer-progress -DskipTests package

      - name: Start against PostgreSQL and verify the schema
        env:
          DB_URL: jdbc:postgresql://localhost:5432/card_platform
          DB_USERNAME: card_app
          DB_PASSWORD: card_app_ci
        run: |
          # Authentication is switched off for this check on purpose: the job
          # verifies the database contract, and starting an identity provider
          # would only add an unrelated way for it to fail.
          java -Dquarkus.oidc.tenant-enabled=false \
               -jar card-service/target/quarkus-app/quarkus-run.jar > app.log 2>&1 &
          echo $! > app.pid

          for _ in $(seq 1 60); do
            if curl -sf http://localhost:8080/q/health/ready > /dev/null; then
              echo "application is ready against PostgreSQL"
              grep -E 'Successfully applied|Schema .* is up to date' app.log || true
              kill "$(cat app.pid)"
              exit 0
            fi
            if ! kill -0 "$(cat app.pid)" 2>/dev/null; then
              echo "::error::the application exited before becoming ready"
              cat app.log
              exit 1
            fi
            sleep 2
          done

          echo "::error::the application never became ready against PostgreSQL"
          cat app.log
          kill "$(cat app.pid)" 2>/dev/null || true
          exit 1

      - name: Application log
        if: failure()
        run: cat app.log

  frontend:
    name: web-app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-app/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit
        run: npm audit --audit-level=high

  # Dependencies are the part of the attack surface nobody writes. npm audit
  # already covered the front end; the backend had nothing looking at it.
  #
  # OSV rather than the NVD feed, because the NVD one needs an API key to be
  # usable at all: without it the scan is rate limited into failure, and a job
  # that cannot run is a job whose result means nothing. OSV needs no key, so
  # this either finds something or genuinely found nothing.
  dependencies:
    name: dependency vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # The resolved tree, not the declared one: a vulnerability reaches this
      # service through a transitive dependency just as easily as a direct one.
      - name: Resolve the full dependency tree
        run: >
          mvn -B --no-transfer-progress dependency:tree
          -DoutputFile=dependency-tree.txt -DoutputType=text

      - name: Scan dependencies
        uses: google/osv-scanner-action/osv-scanner-action@v2.2.4
        with:
          # Recursive over the repository: the scanner finds pom.xml and
          # package-lock.json on its own. Naming an extractor explicitly is how
          # the previous attempt failed — the name it wanted is not the one the
          # ecosystem is called.
          scan-args: |-
            --recursive
            ./

      - name: Publish the resolved tree
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-tree
          path: '**/dependency-tree.txt'
          if-no-files-found: ignore

  # Static analysis of the code this repository actually writes, which dependency
  # scanning cannot see.
  codeql:
    name: static analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Initialise CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      # Quarkus generates bytecode at build time, so the Java analysis needs a
      # real compilation rather than the autobuilder's guess.
      - name: Build for analysis
        if: matrix.language == 'java-kotlin'
        run: mvn -B --no-transfer-progress -DskipTests compile

      - name: Analyse
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

  # The journey a customer actually takes, in a browser, against the real
  # identity provider. Everything above this job can pass while the deployed
  # thing is unusable: a redirect that never comes back, a token the API will
  # not accept, an origin the allow-list forgot. Those only fail here.
  e2e:
    name: browser journey
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-app/package-lock.json

      - name: Start the stack
        run: docker compose up -d postgres redis kafka keycloak

      - name: Package the API
        run: mvn -B --no-transfer-progress -DskipTests package

      - name: Wait for the identity provider
        run: |
          # Keycloak is the slowest thing here and nothing authenticates until it
          # answers. Failing loudly after five minutes beats a browser test that
          # times out on a login page that was never going to appear.
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:8180/realms/card-platform/.well-known/openid-configuration > /dev/null; then
              echo "identity provider is ready"
              exit 0
            fi
            sleep 5
          done
          echo "::error::the identity provider never became ready"
          docker compose logs keycloak
          exit 1

      - name: Start the API
        env:
          DB_PASSWORD: card_app_local
        run: |
          java -jar card-service/target/quarkus-app/quarkus-run.jar > api.log 2>&1 &
          echo $! > api.pid
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:8080/q/health/ready > /dev/null; then
              echo "the API is ready"
              exit 0
            fi
            sleep 3
          done
          echo "::error::the API never became ready"
          cat api.log
          exit 1

      - name: Install the front end
        working-directory: web-app
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run the journey
        working-directory: web-app
        run: npm run e2e

      - name: Failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            web-app/playwright-report/
            web-app/test-results/
            api.log
          if-no-files-found: ignore

      - name: Stop the API
        if: always()
        run: kill "$(cat api.pid)" 2>/dev/null || true
