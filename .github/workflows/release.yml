name: release

# Images are built here and nowhere else. Until now they existed only on the
# machine that happened to run `docker build`, which is why the tag the
# manifests named drifted away from the tag the documentation taught: nothing
# forced the two to agree. A published image has one identity, and the
# manifests can point at it.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  # Nothing is published before the suite that guards the money has passed.
  # A registry that carries an image no test ever saw is worse than no
  # registry: it makes an unverified build look like a release.
  verify:
    name: verify before publishing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test
        run: mvn -B --no-transfer-progress clean verify

      - name: Package the fast-jar the image copies in
        run: mvn -B --no-transfer-progress -pl card-service -am -DskipTests package

      - name: Keep the build output for the image jobs
        uses: actions/upload-artifact@v4
        with:
          name: quarkus-app
          path: card-service/target/quarkus-app/
          retention-days: 1

  publish:
    name: publish ${{ matrix.image }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: card-service
            context: card-service
            dockerfile: card-service/src/main/docker/Dockerfile.jvm
          - image: web-app
            context: web-app
            dockerfile: web-app/Dockerfile
    steps:
      - uses: actions/checkout@v4

      # The card-service image copies target/quarkus-app, which only exists
      # after a Maven build. Rebuilding it here would run the whole thing twice.
      - name: Restore the build output
        if: matrix.image == 'card-service'
        uses: actions/download-artifact@v4
        with:
          name: quarkus-app
          path: card-service/target/quarkus-app/

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The tag comes from the ref rather than from a number typed into a
      # manifest. A version that is written by hand in two places eventually
      # disagrees with itself, and the disagreement surfaces as a pod that
      # never starts.
      - name: Decide the tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The layer cache lives in the registry, so a rebuild that changed
          # only the application layer does not resend the dependencies.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # A release nobody can read is a tag. This writes down what shipped and what
  # image carries it, so a reader does not have to reconstruct either.
  notes:
    name: release notes
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          owner="${{ github.repository_owner }}"
          cat > notes.md <<NOTES
          ## Images

          Both are published to the GitHub Container Registry and are what the
          Kubernetes manifests should reference for this version.

          \`\`\`
          ghcr.io/${owner}/card-service:${VERSION}
          ghcr.io/${owner}/web-app:${VERSION}
          \`\`\`

          ## Verified before publishing

          The full suite ran before either image was built: unit and API tests,
          the money invariants under concurrency against real PostgreSQL, and
          the enforced coverage floors. Nothing is published from a red build.
          NOTES

          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes-file notes.md \
            --generate-notes
